name: Terraform validation

on:
  push:
    branches: [aws]
    paths: ['terraform/**', '.github/workflows/terraform-plan.yml']
  pull_request:
    branches: [aws]
    paths: ['terraform/**', '.github/workflows/terraform-plan.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.7.5
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate -no-color

  # A plan needs AWS credentials and is deliberately not run for untrusted PRs.
  # Add an OIDC-backed environment-specific plan job after configuring a
  # least-privilege role and GitHub environment approval.
